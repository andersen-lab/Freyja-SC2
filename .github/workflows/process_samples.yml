name: Process Samples

on:
  workflow_call:
    outputs:
      new_samples:
        description: 'true if new samples were processed this run'
        value: ${{ jobs.run.outputs.new_samples }}
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}

env:
  NXF_VER: "24.10.4"
  NXF_WORK: ${{ github.workspace }}/work
  NXF_OUTPUT: ${{ github.workspace }}/outputs
  NXF_NAME: github-${{ github.run_number }}
  TOWER_ACCESS_TOKEN: ${{ secrets.TOWER_ACCESS_TOKEN }}
  TOWER_WORKSPACE_ID: ${{ secrets.TOWER_WORKSPACE_ID }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BATCH_SIZE: 150


defaults:
  run:
    shell: bash -eli {0}

jobs:
  run:
    runs-on: [self-hosted, profchaos]
    permissions:
      contents: write
      id-token: write
    outputs:
      new_samples: ${{ steps.check_samples.outputs.new_samples }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Cache envs
        id: cache-envs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.NXF_WORK }}/conda
            $CONDA_PREFIX/envs
          key: env-${{ env.NXF_VER }}-${{ github.job }}-${{ hashFiles('environment.yml') }}
          restore-keys: |
            env-${{ env.NXF_VER }}-${{ github.job }}-
            env-${{ env.NXF_VER }}-
            env-

      - name: 'Check and setup conda environment'
        if: steps.cache-envs.outputs.cache-hit != 'true'
        run: |
          conda env remove -n freyja-sc2 --yes 2>/dev/null || true
          mamba env create -n freyja-sc2 -f environment.yml

      - id: 'auth'
        name: 'Authenticate with gcloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/12767718289/locations/global/workloadIdentityPools/github-actions/providers/freyja-sc2'
          service_account: 'outbreak-ww@andersen-lab-primary.iam.gserviceaccount.com'
          
      - name: Run pipeline on new samples
        run: |
                mamba activate freyja-sc2
                nextflow run main.nf \
                  --num_samples $BATCH_SIZE \
                  -profile local \
                  -entry fetch

      - name: 'Check for new samples'
        id: check_samples
        run: |
          if [ -f data/accession_list.txt ]; then
            echo "new_samples=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_samples=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Update processed samples'
        if: ${{ hashFiles('data/accession_list.txt') != '' }}
        run: |
              mamba activate freyja-sc2
              python scripts/update_sample_status.py $BATCH_SIZE

      - id: 'upload-outputs'
        if: ${{ hashFiles('data/accession_list.txt') != '' }}
        name: 'Upload Outputs to Cloud Storage'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          path: 'outputs/'
          destination: 'outbreak-ww-data/'
          parent: false
          project_id: 'andersen-lab-primary'

      - name: 'Upload run outputs for muninn ingestion'
        if: ${{ hashFiles('data/accession_list.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: run-outputs
          path: |
            outputs/variants
            outputs/demix
          if-no-files-found: ignore
          retention-days: 1
      
      - name: 'Commit and push changes'
        if: ${{ hashFiles('data/accession_list.txt') != '' }}
        run: |
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git config --global user.name "github-actions[bot]"
              git remote set-url origin https://github.com/andersen-lab/freyja-sc2
              git add data/all_metadata.tsv
              git commit -m "Update processed samples"
              git push

      - name: 'Create GitHub Run Summary'
        if: ${{ hashFiles('data/accession_list.txt') != '' }}
        run: |
          echo "# Job Summary $(date)" >> $GITHUB_STEP_SUMMARY
          echo "## Job Information" >> $GITHUB_STEP_SUMMARY
          cat data/all_metadata.tsv | rev | cut -f 2 | rev | sort | uniq -c >> $GITHUB_STEP_SUMMARY

      - name: 'Clean workspace'
        if: always()
        run: |
              rm -rf ${{ github.workspace }}/*
