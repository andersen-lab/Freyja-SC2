name: Process Samples

on:
  schedule:
    - cron: '0 0 * * SUN'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


defaults:
  run:
    shell: bash -eli {0}

jobs:
  run:
    runs-on: [self-hosted, profchaos]
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Cache envs
        id: cache-envs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NXF_WORK }}/conda
            $CONDA_PREFIX/envs
          key: env-${{ env.NXF_VER }}-${{ github.job }}
          restore-keys: |
            env-${{ env.NXF_VER }}-${{ github.job }}
            env-${{ env.NXF_VER }}
            env-

      - name: 'Check and setup conda environment'
        run: | 
          mamba env update --name freyja-sc2 --file environment.yml --prune

      - id: 'auth'
        name: 'Authenticate with gcloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/12767718289/locations/global/workloadIdentityPools/github-actions/providers/freyja-sc2'
          service_account: 'outbreak-ww@andersen-lab-primary.iam.gserviceaccount.com'

      - name: 'Fetch all Freyja-SC2 outputs'
        run: |
          mamba activate freyja-sc2
          OUTPUT_DIR="sc2_ww_$(date +%d_%b_%H%M | tr '[:upper:]' '[:lower:]')"
          mkdir -p "$OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

          gcloud storage cp -r gs://outbreak-ww-data/variants . --billing-project=andersen-lab-primary
          python scripts/aggregate_variants.py -i variants -o "$OUTPUT_DIR"

          mkdir -p ${OUTPUT_DIR}/demixed
          gcloud storage cp gs://outbreak-ww-data/demix/* ${OUTPUT_DIR}/demixed --billing-project=andersen-lab-primary
          python scripts/fix_demix_output.py -i ${OUTPUT_DIR}/demixed # Temporary workaround for naming compatability with muninn

          python scripts/aggregate_sample_metadata.py -o ${OUTPUT_DIR}

          curl -o "$OUTPUT_DIR/lineages.yml" https://raw.githubusercontent.com/andersen-lab/Freyja/refs/heads/main/freyja/data/lineages.yml

          zip -r "${OUTPUT_DIR}.zip" $OUTPUT_DIR