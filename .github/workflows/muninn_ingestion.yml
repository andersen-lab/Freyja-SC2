name: Muninn Ingestion

on:
  workflow_call:
    inputs:
      ingest_source:
        description: 'Where to read Freyja outputs from: artifact (new outputs from this run) or bucket (re-ingest everything in gs://outbreak-ww-data)'
        type: string
        default: 'artifact'
  workflow_dispatch:
    inputs:
      ingest_source:
        description: 'Where to read Freyja outputs from'
        type: choice
        default: 'bucket'
        options:
          - artifact
          - bucket
      test_mode:
        description: 'Fetch only the first 10 accessions from data/all_metadata.tsv instead of the full bucket (bucket mode only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.repository }}

env:
  NXF_VER: "24.10.4"
  NXF_WORK: ${{ github.workspace }}/work
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


defaults:
  run:
    shell: bash -eli {0}

jobs:
  run:
    runs-on: [self-hosted, profchaos]
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Cache envs
        id: cache-envs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.NXF_WORK }}/conda
            $CONDA_PREFIX/envs
          key: env-${{ env.NXF_VER }}-${{ github.job }}
          restore-keys: |
            env-${{ env.NXF_VER }}-${{ github.job }}
            env-${{ env.NXF_VER }}
            env-

      - name: 'Check and setup conda environment'
        run: | 
          mamba env update --name freyja-sc2 --file environment.yml --prune

      - id: 'auth'
        name: 'Authenticate with gcloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/12767718289/locations/global/workloadIdentityPools/github-actions/providers/freyja-sc2'
          service_account: 'outbreak-ww@andersen-lab-primary.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Download new run outputs'
        if: ${{ inputs.ingest_source == 'artifact' }}
        uses: actions/download-artifact@v8
        with:
          name: run-outputs
          path: outputs

      - name: 'Fetch all outputs from bucket'
        if: ${{ inputs.ingest_source == 'bucket' }}
        run: |
          mkdir -p outputs/variants outputs/demix
          if [[ "${{ inputs.test_mode }}" == "true" ]]; then
            # Test mode: fetch only the first 10 accessions from data/all_metadata.tsv
            ACCS=$(tail -n +2 data/all_metadata.tsv | head -n 10 | cut -f1)
            for ACC in $ACCS; do
              gcloud storage cp "gs://outbreak-ww-data/variants/${ACC}_variants.tsv" outputs/variants/ --billing-project=andersen-lab-primary 2>/dev/null || true
              gcloud storage cp "gs://outbreak-ww-data/variants/${ACC}_depths.tsv" outputs/variants/ --billing-project=andersen-lab-primary 2>/dev/null || true
              gcloud storage cp "gs://outbreak-ww-data/demix/${ACC}.demixed" outputs/demix/ --billing-project=andersen-lab-primary 2>/dev/null || true
            done
          else
            gcloud storage cp -r gs://outbreak-ww-data/variants/* outputs/variants --billing-project=andersen-lab-primary
            gcloud storage cp gs://outbreak-ww-data/demix/* outputs/demix --billing-project=andersen-lab-primary
          fi

      - name: 'Format outputs for muninn'
        run: |
          mamba activate freyja-sc2
          OUTPUT_DIR="sc2_ww_$(date +%d_%b_%H%M | tr '[:upper:]' '[:lower:]')"
          mkdir -p "$OUTPUT_DIR/demixed"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

          python scripts/aggregate_variants.py -i outputs/variants -o "$OUTPUT_DIR"

          cp outputs/demix/*.demixed "$OUTPUT_DIR/demixed/" 2>/dev/null || true

          python scripts/aggregate_sample_metadata.py -o "$OUTPUT_DIR"

          curl -o "$OUTPUT_DIR/lineages.yml" https://raw.githubusercontent.com/andersen-lab/Freyja/refs/heads/main/freyja/data/lineages.yml

          # Freyja-SC2 only produces intra-host variants, but muninn's combined
          # parser still requires a mutations file alongside the variants file,
          # so emit a header-only TSV to ingest zero mutations.
          printf 'sra\tpos\tref\talt\tregion\tGFF_FEATURE\tref_codon\talt_codon\tref_aa\talt_aa\tpos_aa\n' > "${OUTPUT_DIR}/mutations_sc2.tsv"

          zip -r "${OUTPUT_DIR}.zip" "$OUTPUT_DIR"

      - name: 'Upload archive to muninn VM'
        run: |
          gcloud compute scp "${OUTPUT_DIR}.zip" \
            "${{ vars.MUNINN_VM_NAME }}:${{ vars.MUNINN_DATA_INPUT_DIR }}/${OUTPUT_DIR}.zip" \
            --zone "${{ vars.MUNINN_VM_ZONE }}" \
            --project "${{ vars.MUNINN_VM_PROJECT }}" \
            --tunnel-through-iap

      - name: 'Ingest archive into muninn'
        run: |
          gcloud compute ssh "${{ vars.MUNINN_VM_NAME }}" \
            --zone "${{ vars.MUNINN_VM_ZONE }}" \
            --project "${{ vars.MUNINN_VM_PROJECT }}" \
            --tunnel-through-iap \
            --command "docker exec ${{ vars.MUNINN_INSTANCE_NAME }}_server muninn_ingest_sc2_wastewater --auto --archive_in ${OUTPUT_DIR}.zip"

      - name: 'Tail muninn ingestion log'
        if: always()
        run: |
          gcloud compute ssh "${{ vars.MUNINN_VM_NAME }}" \
            --zone "${{ vars.MUNINN_VM_ZONE }}" \
            --project "${{ vars.MUNINN_VM_PROJECT }}" \
            --tunnel-through-iap \
            --command "ls -t ${{ vars.MUNINN_DATA_INPUT_DIR }}/ingest_sc2_*.log | head -1 | xargs tail -n 50" \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: 'Clean up archive on muninn VM'
        if: always()
        run: |
          gcloud compute ssh "${{ vars.MUNINN_VM_NAME }}" \
            --zone "${{ vars.MUNINN_VM_ZONE }}" \
            --project "${{ vars.MUNINN_VM_PROJECT }}" \
            --tunnel-through-iap \
            --command "rm -f ${{ vars.MUNINN_DATA_INPUT_DIR }}/${OUTPUT_DIR}.zip" || true

      - name: 'Clean workspace'
        if: always()
        run: |
          rm -rf ${{ github.workspace }}/*
